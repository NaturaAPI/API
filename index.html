<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챗봇 테스트</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        input, button { margin-top: 10px; padding: 10px; font-size: 16px; }
        #response { margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h1>Hugging Face 챗봇</h1>
    <input type="text" id="userInput" placeholder="메시지를 입력하세요">
    <button onclick="sendMessage()">전송</button>

    <h2>챗봇 응답:</h2>
    <div id="response"></div>

    <script>
        async function sendMessage() {
            const userMessage = document.getElementById("userInput").value;
            if (!userMessage) {
                alert("메시지를 입력하세요!");
                return;
            }

            try {
                const response = await fetch('https://beamish-melba-ba4300.netlify.app/api/huggingface', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: userMessage })
                });

                const data = await response.json();
                document.getElementById("response").textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('오류 발생:', error);
                document.getElementById("response").textContent = "API 요청 실패!";
            }
        }
    </script>

</body>
</html>
