<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>챗봇과 대화하기</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f4f4f9;
    }
    #chat-box {
      width: 80%;
      max-width: 600px;
      height: 400px;
      background-color: white;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      overflow-y: auto;
    }
    #user-input {
      width: 80%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    #send-button {
      padding: 10px 15px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    #send-button:hover {
      background-color: #0056b3;
    }
    .message {
      margin: 5px 0;
      padding: 10px;
      border-radius: 5px;
      background-color: #e6e6e6;
    }
    .user-message {
      background-color: #007BFF;
      color: white;
      text-align: right;
    }
    .bot-message {
      background-color: #f1f1f1;
      color: black;
      text-align: left;
    }
  </style>
</head>
<body>

  <h1>챗봇과 대화하기</h1>
  
  <!-- 채팅 박스 -->
  <div id="chat-box"></div>

  <!-- 사용자 입력창 -->
  <input type="text" id="user-input" placeholder="메시지를 입력하세요" />

  <!-- 전송 버튼 -->
  <button id="send-button">전송</button>

  <script>
    // sendMessageToAPI 함수 정의
    async function sendMessageToAPI(userMessage) {
      try {
        const response = await fetch('https://beamish-melba-ba4300.netlify.app/.netlify/functions/huggingface', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ inputs: userMessage })
        });

        const data = await response.json();

        // 응답 처리
        console.log('챗봇 응답:', data);

        // 챗봇 응답 화면에 표시
        displayMessage(data.generated_text, 'bot');
        return data;
      } catch (error) {
        console.error('오류 발생:', error);
        displayMessage('오류가 발생했습니다. 다시 시도해 주세요.', 'bot');
      }
    }

    // 사용자 메시지 및 챗봇 응답을 화면에 표시
    function displayMessage(message, sender) {
      const chatBox = document.getElementById('chat-box');
      const messageElement = document.createElement('div');
      messageElement.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
      messageElement.textContent = message;
      chatBox.appendChild(messageElement);

      // 채팅 박스 스크롤을 가장 아래로 자동으로 맞추기
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 전송 버튼 클릭 이벤트 처리
    document.getElementById('send-button').addEventListener('click', () => {
      const userMessage = document.getElementById('user-input').value.trim();

      if (userMessage) {
        displayMessage(userMessage, 'user');  // 사용자 메시지 화면에 표시
        document.getElementById('user-input').value = '';  // 입력창 비우기
        sendMessageToAPI(userMessage);  // API 호출
      }
    });

    // Enter 키로 메시지 전송 가능하도록 설정
    document.getElementById('user-input').addEventListener('keypress', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        document.getElementById('send-button').click();
      }
    });
  </script>

</body>
</html>
